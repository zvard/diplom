<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <h1 class="logo">last.fm</h1>
            <div class="search-container">
                <input type="text" class="search-input" placeholder="Search for artists, tracks, albums" id="searchInput">
                <button class="search-button" id="searchButton">Search</button>
            </div>
        </div>
    </div>
    
    <div class="app-container">
        <header class="app-header">
            <nav class="main-nav">
                <a href="#" class="nav-link" data-section="artists">Music</a>
                <a href="#" class="nav-link" data-section="tracks">Charts</a>
            </nav>
        </header>

        <main class="app-main">
            <div class="loading-spinner" id="loadingSpinner" style="display: none;"></div>
            <div class="error-message" id="errorMessage" style="display: none;"></div>
            
            <section class="artists-section" id="artistsSection">
                <h2>Hot right now</h2>
                <div class="artists-grid" id="artistsGrid"></div>
            </section>

            <section class="albums-section" id="albumsSection" style="display: none;">
                <h2>Albums</h2>
                <div class="albums-grid" id="albumsGrid"></div>
            </section>

            <section class="tracks-section" id="tracksSection">
                <h2>Popular tracks</h2>
                <div class="tracks-grid" id="tracksGrid"></div>
            </section>
        </main>
    </div>

    
    
    <div class="bottom-bar">
    <footer class="app-footer">
        <div class="footer-links">
            <span>COMPANY</span>
            <span>NEW</span>
            <span>GOODIES</span>
            <span>ACCOUNT</span>
            <span>FOLLOW US</span>
            <span>PASSAGE</span>
        </div>
    </footer>
</div>

    <script src="script.js"></script>
</body>
</html>
